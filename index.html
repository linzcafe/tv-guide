<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TV Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e10;
    --surface: #17171a;
    --surface2: #1f1f24;
    --border: #2a2a32;
    --accent-uk: #3d7aed;
    --accent-vrt: #e8a020;
    --accent-vtm: #d63b3b;
    --accent-rtbf: #2db87a;
    --text: #f0f0f2;
    --text-dim: #8888a0;
    --text-muted: #55556a;
    --live-dot: #ff4444;
    --radius: 10px;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(14,14,16,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 10px;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .logo {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .logo span {
    color: var(--accent-uk);
  }

  .clock {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  .tab-bar {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding-bottom: 2px;
  }
  .tab-bar::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    padding: 5px 12px;
    border-radius: 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.5px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .tab.active {
    background: var(--accent-uk);
    border-color: var(--accent-uk);
    color: white;
  }

  .tab[data-group="vrt"].active { background: var(--accent-vrt); border-color: var(--accent-vrt); color: #111; }
  .tab[data-group="vtm"].active { background: var(--accent-vtm); border-color: var(--accent-vtm); }
  .tab[data-group="rtbf"].active { background: var(--accent-rtbf); border-color: var(--accent-rtbf); color: #111; }

  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 14px;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .refresh-btn:hover { border-color: var(--accent-uk); color: var(--accent-uk); }
  .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .group-section {
    display: none;
    padding: 12px 16px 0;
  }
  .group-section.active { display: block; }

  .group-label {
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 18px 0 8px;
  }

  .channel-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .channel-card:hover { border-color: #3a3a48; }

  .channel-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--border);
  }

  .channel-badge {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 10px;
    letter-spacing: 0.5px;
    padding: 3px 7px;
    border-radius: 5px;
    flex-shrink: 0;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .badge-uk { background: var(--accent-uk); color: white; }
  .badge-vrt { background: var(--accent-vrt); color: #111; }
  .badge-vtm { background: var(--accent-vtm); color: white; }
  .badge-rtbf { background: var(--accent-rtbf); color: #111; }
  .badge-rtl { background: #7c5cbf; color: white; }

  .channel-name {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--live-dot);
    animation: pulse 2s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .programme-now {
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
  }

  .now-label {
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--live-dot);
    margin-bottom: 3px;
    font-weight: 500;
  }

  .prog-title {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 3px;
  }

  .prog-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-dim);
  }

  .prog-time { letter-spacing: 0.5px; }

  .progress-bar {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 7px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--live-dot);
    transition: width 0.5s ease;
  }

  .upcoming-list { padding: 6px 0; }

  .upcoming-item {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 5px 12px;
    transition: background 0.1s;
  }
  .upcoming-item:hover { background: rgba(255,255,255,0.03); }

  .up-time {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    flex-shrink: 0;
    width: 40px;
  }

  .up-title {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.3;
  }

  .loading-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 8px;
    padding: 16px 12px;
  }

  .skeleton {
    background: linear-gradient(90deg, var(--surface2) 25%, #252530 50%, var(--surface2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 4px;
    height: 12px;
    margin-bottom: 8px;
  }
  .skeleton.wide { width: 75%; }
  .skeleton.narrow { width: 45%; }
  .skeleton.title { height: 16px; width: 85%; margin-bottom: 10px; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .error-msg {
    background: rgba(214,59,59,0.1);
    border: 1px solid rgba(214,59,59,0.3);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 12px;
    color: #ff8888;
    margin-bottom: 8px;
    line-height: 1.5;
  }

  .last-updated {
    text-align: center;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    padding: 16px 0 0;
  }

  .prog-desc {
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.4;
    margin-top: 2px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .kids-badge {
    font-size: 9px;
    background: rgba(255, 180, 0, 0.15);
    color: #ffb400;
    border: 1px solid rgba(255,180,0,0.3);
    border-radius: 4px;
    padding: 1px 5px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo">TV<span>NOW</span></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div class="clock" id="clock">--:--</div>
      <button class="refresh-btn" id="refreshBtn" title="Refresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 .49-4.68"></path>
        </svg>
      </button>
    </div>
  </div>
  <div class="tab-bar">
    <button class="tab active" data-group="all">All</button>
    <button class="tab" data-group="uk">🇬🇧 UK</button>
    <button class="tab" data-group="vrt">VRT</button>
    <button class="tab" data-group="vtm">VTM/Play</button>
    <button class="tab" data-group="rtl">RTL</button>
    <button class="tab" data-group="rtbf">RTBF</button>
    <button class="tab" data-group="kids">🧒 Kids</button>
  </div>
</header>

<div id="main" style="padding: 4px 0 0;"></div>

<script>
const CHANNELS = [
  // UK
  { id: "bbc1",    name: "BBC ONE",    badge: "UK",  group: "uk",   kids: false },
  { id: "bbc2",    name: "BBC TWO",    badge: "UK",  group: "uk",   kids: false },
  { id: "itv1",    name: "ITV1",       badge: "UK",  group: "uk",   kids: false },
  { id: "cbeebies",name: "CBeebies",   badge: "UK",  group: "uk",   kids: true  },
  // VRT
  { id: "vrt1",    name: "VRT EÉN",    badge: "VRT", group: "vrt",  kids: false },
  { id: "canvas",  name: "VRT Canvas", badge: "VRT", group: "vrt",  kids: false },
  { id: "ketjunior",name:"Ketnet Jr",  badge: "VRT", group: "vrt",  kids: true  },
  { id: "ketnet",  name: "Ketnet",     badge: "VRT", group: "vrt",  kids: true  },
  // VTM / Play
  { id: "vtm",     name: "VTM",        badge: "VTM", group: "vtm",  kids: false },
  { id: "vtm2",    name: "VTM2",       badge: "VTM", group: "vtm",  kids: false },
  { id: "play4",   name: "Play 4",     badge: "VTM", group: "vtm",  kids: false },
  { id: "play5",   name: "Play 5",     badge: "VTM", group: "vtm",  kids: false },
  { id: "play6",   name: "Play 6",     badge: "VTM", group: "vtm",  kids: false },
  { id: "playkids",name: "Play Kids",  badge: "VTM", group: "vtm",  kids: true  },
  // RTL (Belgium)
  { id: "rtlbe",   name: "RTL Belgium",badge: "RTL", group: "rtl",  kids: false },
  { id: "rtltvi",  name: "RTL-TVI",    badge: "RTL", group: "rtl",  kids: false },
  { id: "club",    name: "Club RTL",   badge: "RTL", group: "rtl",  kids: false },
  { id: "plug",    name: "Plug RTL",   badge: "RTL", group: "rtl",  kids: false },
  // TF1
  { id: "tf1",     name: "TF1",        badge: "RTL", group: "rtl",  kids: false },
  // RTBF
  { id: "la1",     name: "La Une",     badge: "RTBF",group: "rtbf", kids: false },
  { id: "la2",     name: "La Deux",    badge: "RTBF",group: "rtbf", kids: false },
  { id: "ouftivi", name: "Ouftivi",    badge: "RTBF",group: "rtbf", kids: true  },
];

const BADGE_CLASS = { UK:"badge-uk", VRT:"badge-vrt", VTM:"badge-vtm", RTBF:"badge-rtbf", RTL:"badge-rtl" };

let scheduleData = {};
let lastUpdated = null;
let isLoading = false;

// Clock
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false });
}
setInterval(updateClock, 1000);
updateClock();

// Progress calculation
function getProgress(startStr, endStr) {
  try {
    const now = Date.now();
    const toMs = s => {
      const [h, m] = s.split(":").map(Number);
      const d = new Date();
      d.setHours(h, m, 0, 0);
      if (d.getTime() < now - 6*3600000) d.setDate(d.getDate()+1);
      return d.getTime();
    };
    const s = toMs(startStr), e = toMs(endStr);
    return Math.min(100, Math.max(0, ((now - s) / (e - s)) * 100));
  } catch { return 0; }
}

// Render
function renderCard(ch) {
  const data = scheduleData[ch.id];
  const badgeClass = BADGE_CLASS[ch.badge] || "badge-uk";

  if (!data || data.loading) {
    return `<div class="loading-card">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
        <div class="skeleton" style="width:48px;height:18px;border-radius:5px;"></div>
        <div class="skeleton" style="width:100px;height:14px;"></div>
      </div>
      <div class="skeleton title"></div>
      <div class="skeleton narrow"></div>
    </div>`;
  }

  if (data.error) {
    return `<div class="channel-card">
      <div class="channel-header">
        <span class="channel-badge ${badgeClass}">${ch.badge}</span>
        <span class="channel-name">${ch.name}</span>
        ${ch.kids ? '<span class="kids-badge">KIDS</span>' : ''}
      </div>
      <div class="error-msg">Could not load schedule</div>
    </div>`;
  }

  const now = data.now || {};
  const upcoming = (data.upcoming || []).slice(0, 3);
  const progress = now.start && now.end ? getProgress(now.start, now.end) : 0;

  return `<div class="channel-card">
    <div class="channel-header">
      <span class="channel-badge ${badgeClass}">${ch.badge}</span>
      <span class="channel-name">${ch.name}</span>
      ${ch.kids ? '<span class="kids-badge">KIDS</span>' : ''}
      <div class="live-dot"></div>
    </div>
    <div class="programme-now">
      <div class="now-label">● ON NOW</div>
      <div class="prog-title">${now.title || '—'}</div>
      ${now.desc ? `<div class="prog-desc">${now.desc}</div>` : ''}
      <div class="prog-meta">
        <span class="prog-time">${now.start || ''} – ${now.end || ''}</span>
        ${now.genre ? `<span style="color:var(--text-muted)">${now.genre}</span>` : ''}
      </div>
      ${progress > 0 ? `<div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>` : ''}
    </div>
    ${upcoming.length ? `<div class="upcoming-list">
      ${upcoming.map(p => `<div class="upcoming-item">
        <span class="up-time">${p.start}</span>
        <span class="up-title">${p.title}</span>
      </div>`).join('')}
    </div>` : ''}
  </div>`;
}

function getCurrentGroup() {
  return document.querySelector(".tab.active")?.dataset.group || "all";
}

function render() {
  const group = getCurrentGroup();
  const main = document.getElementById("main");

  const groups = [
    { label: "🇬🇧 UK Channels", key: "uk", channels: CHANNELS.filter(c => c.group === "uk") },
    { label: "🇧🇪 VRT", key: "vrt", channels: CHANNELS.filter(c => c.group === "vrt") },
    { label: "🇧🇪 VTM / Play", key: "vtm", channels: CHANNELS.filter(c => c.group === "vtm") },
    { label: "🇧🇪 RTL / TF1", key: "rtl", channels: CHANNELS.filter(c => c.group === "rtl") },
    { label: "🇧🇪 RTBF", key: "rtbf", channels: CHANNELS.filter(c => c.group === "rtbf") },
  ];

  let html = '';

  if (group === "kids") {
    const kids = CHANNELS.filter(c => c.kids);
    html = `<div class="group-section active"><div class="group-label">🧒 Children's Channels</div>
      ${kids.map(renderCard).join('')}
      ${lastUpdated ? `<div class="last-updated">Updated ${lastUpdated}</div>` : ''}
    </div>`;
  } else if (group === "all") {
    html = groups.map(g => `<div class="group-section active">
      <div class="group-label">${g.label}</div>
      ${g.channels.map(renderCard).join('')}
    </div>`).join('') + (lastUpdated ? `<div class="group-section active"><div class="last-updated">Updated ${lastUpdated}</div></div>` : '');
  } else {
    const g = groups.find(x => x.key === group);
    if (g) {
      html = `<div class="group-section active">
        <div class="group-label">${g.label}</div>
        ${g.channels.map(renderCard).join('')}
        ${lastUpdated ? `<div class="last-updated">Updated ${lastUpdated}</div>` : ''}
      </div>`;
    }
  }

  main.innerHTML = html;
}

// API fetch
async function fetchSchedule() {
  if (isLoading) return;
  isLoading = true;
  const btn = document.getElementById("refreshBtn");
  btn.classList.add("spinning");

  // Mark all as loading
  CHANNELS.forEach(ch => { scheduleData[ch.id] = { loading: true }; });
  render();

  const now = new Date();
  const timeStr = now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false });
  const dateStr = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

  const prompt = `You are a TV schedule assistant. Today is ${dateStr} and the current time is ${timeStr} (Brussels/London time).

Return ONLY a valid JSON object — no markdown, no explanation — with this exact structure:
{
  "bbc1": { "now": { "title": "...", "start": "HH:MM", "end": "HH:MM", "genre": "...", "desc": "..." }, "upcoming": [{"start":"HH:MM","title":"..."},{"start":"HH:MM","title":"..."},{"start":"HH:MM","title":"..."}] },
  ... (same structure for every channel id listed below)
}

Channel IDs to include (provide your best knowledge of typical/likely schedules for each, using real programme names where you know them, or realistic placeholders):
bbc1, bbc2, itv1, cbeebies, vrt1, canvas, ketnet, ketjunior, vtm, vtm2, play4, play5, play6, playkids, rtlbe, rtltvi, club, plug, tf1, la1, la2, ouftivi

Rules:
- "now" must be what is airing at exactly ${timeStr} on that channel
- "upcoming" = next 3 programmes after "now" with their start times
- Keep "desc" to max 12 words
- "genre" = one word (Drama/News/Entertainment/Kids/Sport/Film/Factual/Comedy/Music)
- Times in HH:MM 24h format
- Return ONLY the JSON, starting with { and ending with }`;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 3000,
        tools: [{ "type": "web_search_20250305", "name": "web_search" }],
        messages: [{ role: "user", content: prompt }]
      })
    });

    const data = await response.json();

    // Extract text from response (may be after tool use)
    let rawText = "";
    for (const block of (data.content || [])) {
      if (block.type === "text") rawText += block.text;
    }

    // If tool use happened, do a follow-up
    if (!rawText.trim().startsWith("{")) {
      // Try a second call without web search for pure JSON output
      const r2 = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 3000,
          system: "You are a TV schedule assistant. Respond ONLY with raw JSON. No markdown backticks, no explanation, no preamble. Start your response with { and end with }.",
          messages: [
            { role: "user", content: prompt },
            ...data.content ? [{ role: "assistant", content: data.content }] : [],
            ...(data.content ? [{ role: "user", content: "Now output ONLY the final JSON object as described. No markdown." }] : [])
          ]
        })
      });
      const d2 = await r2.json();
      for (const block of (d2.content || [])) {
        if (block.type === "text") rawText += block.text;
      }
    }

    // Parse JSON
    const jsonMatch = rawText.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error("No JSON found in response");
    const parsed = JSON.parse(jsonMatch[0]);

    CHANNELS.forEach(ch => {
      scheduleData[ch.id] = parsed[ch.id] || { error: true };
    });

    lastUpdated = now.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

  } catch (err) {
    console.error(err);
    CHANNELS.forEach(ch => {
      scheduleData[ch.id] = { error: true };
    });
  }

  isLoading = false;
  btn.classList.remove("spinning");
  render();
}

// Progress refresh every minute
setInterval(() => {
  if (!isLoading) render();
}, 60000);

// Auto-refresh every 30 minutes
setInterval(() => {
  fetchSchedule();
}, 30 * 60 * 1000);

// Tab switching
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    render();
  });
});

document.getElementById("refreshBtn").addEventListener("click", fetchSchedule);

// Initial load
fetchSchedule();
</script>
</body>
</html>
